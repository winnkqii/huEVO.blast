<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>huEVO.blast</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0b10;
            color: #d1d5db;
            margin: 0; padding: 0;
            overflow: hidden;
            height: 100vh; height: 100dvh;
            display: flex; flex-direction: column; align-items: center; justify-between;
        }
        .glass { background: rgba(22, 25, 35, 0.85); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.06); }
    </style>
</head>
<body class="h-full flex flex-col items-center justify-between p-3">

    <!-- Шапка -->
    <header class="w-full max-w-md glass rounded-2xl px-3 py-2 flex items-center justify-between shadow-lg">
        <div class="flex items-center gap-2">
            <span class="text-xl">🧩</span>
            <h1 class="font-black text-sm text-slate-100">huEVO.blast</h1>
        </div>
        <div class="flex items-center gap-2">
            <button id="btnOpenShop" class="px-2.5 py-1 rounded-xl bg-slate-800 text-xs font-bold text-cyan-400 border border-white/5">
                💎 <span id="coinCount">50</span>
            </button>
            <button id="btnLeaderboard" class="w-8 h-8 rounded-xl bg-slate-800 text-amber-400 flex items-center justify-center text-xs">🏆</button>
        </div>
    </header>

    <!-- Счет и бустеры -->
    <div class="w-full max-w-md grid grid-cols-3 gap-2">
        <div class="glass rounded-xl p-2 flex flex-col justify-center">
            <span class="text-[9px] text-slate-500 uppercase font-bold">счёт</span>
            <span id="scoreVal" class="text-lg font-black text-white">0</span>
        </div>
        <div class="glass rounded-xl p-2 flex flex-col justify-center">
            <span class="text-[9px] text-amber-500 uppercase font-bold">рекорд</span>
            <span id="bestVal" class="text-lg font-black text-amber-400">0</span>
        </div>
        <div class="glass rounded-xl p-1 flex items-center justify-around">
            <button id="btnHammer" class="text-base p-1">🔨<span id="hCount" class="text-[10px] text-slate-400">2</span></button>
            <button id="btnReroll" class="text-base p-1">🔄<span id="rCount" class="text-[10px] text-slate-400">2</span></button>
            <button id="btnRestart" class="text-sm p-1 text-slate-400">↺</button>
        </div>
    </div>

    <!-- Игровое поле (Canvas) -->
    <main class="relative w-full max-w-md flex-1 flex flex-col items-center justify-center my-2">
        <div id="canvasBox" class="w-full aspect-square max-h-[60vh] glass rounded-2xl p-2 flex items-center justify-center shadow-xl overflow-hidden">
            <canvas id="gameCanvas" class="w-full h-full rounded-xl touch-none"></canvas>
        </div>
    </main>

    <!-- Модалка магазина -->
    <div id="shopModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="w-full max-w-sm glass rounded-3xl p-5 text-center">
            <h2 class="text-base font-extrabold text-white mb-3">магазин кристаллов</h2>
            <p class="text-xs text-slate-400 mb-4">ваш баланс: <span id="shopCoins" class="text-cyan-400 font-bold">50</span> кристаллов</p>
            <button id="btnDonate" class="w-full py-2.5 rounded-xl bg-amber-600 text-white font-bold text-xs mb-3">⭐ купить через huEVO</button>
            <button id="btnCloseShop" class="w-full py-2 rounded-xl bg-slate-800 text-slate-300 text-xs font-bold">закрыть</button>
        </div>
    </div>

    <script>
        // Простой и надежный движок игры
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const box = document.getElementById('canvasBox');

        let score = 0, best = localStorage.getItem('h_best') || 0;
        let coins = Number(localStorage.getItem('h_coins')) || 50;
        let grid = Array.from({length: 8}, () => Array(8).fill(null));
        let cellSize = 40, boardX = 0, boardY = 0;

        document.getElementById('bestVal').textContent = best;
        document.getElementById('coinCount').textContent = coins;

        function resize() {
            const size = Math.min(box.clientWidth - 16, box.clientHeight - 16);
            canvas.width = size; canvas.height = size;
            cellSize = size / 8;
            render();
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            // Рисуем сетку 8х8
            for(let r=0; r<8; r++) {
                for(let c=0; c<8; c++) {
                    ctx.fillStyle = '#171a24';
                    ctx.beginPath();
                    ctx.roundRect(c*cellSize + 2, r*cellSize + 2, cellSize - 4, cellSize - 4, 4);
                    ctx.fill();
                    
                    if(grid[r][c]) {
                        ctx.fillStyle = grid[r][c];
                        ctx.beginPath();
                        ctx.roundRect(c*cellSize + 3, r*cellSize + 3, cellSize - 6, cellSize - 6, 5);
                        ctx.fill();
                    }
                }
            }
        }

        // Управление модалкой магазина
        document.getElementById('btnOpenShop').onclick = () => {
            document.getElementById('shopCoins').textContent = coins;
            document.getElementById('shopModal').classList.remove('hidden');
        };
        document.getElementById('btnCloseShop').onclick = () => document.getElementById('shopModal').classList.add('hidden');

        // Донат через huEVO
        document.getElementById('btnDonate').onclick = () => {
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({ type: 'HUEVO_REQUEST_DONATE', amount: 500 }, '*');
            } else {
                coins += 500;
                localStorage.setItem('h_coins', coins);
                document.getElementById('coinCount').textContent = coins;
                alert('тест: +500 кристаллов добавлено!');
            }
        };

        window.addEventListener('resize', resize);
        window.addEventListener('load', resize);
    </script>
</body>
</html>
